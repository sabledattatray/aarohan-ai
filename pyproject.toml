[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aarohan"
version = "0.1.0"
description = "AAROHAN AI - Independent Foundation Language Model"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.4,<3.0",
    "numpy>=1.26,<3.0",
    "psutil>=5.9,<8.0",
    "tokenizers>=0.20,<1.0",
    "pytest>=8.0,<9.0",
]

[project.optional-dependencies]
data = [
    "huggingface_hub>=0.25,<1.0",
    "pyarrow>=18,<25",
    "pypdf>=6.21,<8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501", "E402"]

[tool.ruff.lint.isort]
known-first-party = ["aarohan", "scripts"]
